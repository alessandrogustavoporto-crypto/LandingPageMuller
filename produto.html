<style>
:root{--bd:#0066cc;--bm:#1a75d1;--bl:#4d94ff;--ba:#004c99;--bh:#003366;--w:#fff;--gl:#F5F8FA;--gm:#e8eef4;--gb:#dce6ef;--gt:#263238;--gs:#546e7a;--gmu:#78909c;--gwa:#25D366;--gwd:#1ebe5d;--rmd:14px;--rlg:22px;--rxl:30px;--sms:0 2px 8px rgba(0,102,204,.08);--smd:0 6px 24px rgba(0,102,204,.12);--slg:0 16px 48px rgba(0,102,204,.15);--tr:all .25s ease;--fb:'Inter',sans-serif;--fh:'Plus Jakarta Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--gt);background:var(--w);overflow-x:hidden;line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
img{max-width:100%;display:block}a{text-decoration:none;color:inherit}
.container{max-width:1240px;margin:0 auto;padding:0 24px}
#nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--gb);transition:var(--tr)}
#nav.sc{box-shadow:var(--smd)}
.ni{display:flex;align-items:center;justify-content:space-between;height:72px}
.nlinks{display:flex;align-items:center;gap:6px;list-style:none}
.nlinks a{font-size:.875rem;font-weight:600;color:var(--gt);padding:8px 14px;border-radius:8px;transition:var(--tr)}
.nlinks a:hover{background:var(--gl);color:var(--bd)}
.nav-ofertas{display:inline-flex!important;align-items:center!important;line-height:1!important;background:var(--bd)!important;color:var(--w)!important;border-radius:100px!important;padding:8px 16px!important;font-weight:700!important;box-shadow:0 2px 10px rgba(0,102,204,.35)}
.nav-ofertas:hover{background:var(--bm)!important;transform:translateY(-1px)!important}
.nr{display:flex;align-items:center;gap:12px}
.nwa{display:inline-flex;align-items:center;gap:8px;background:var(--gwa);color:var(--w);font-weight:700;font-size:.85rem;padding:10px 20px;border-radius:100px;transition:var(--tr)}
.nwa:hover{background:var(--gwd);transform:translateY(-1px)}
.hbg{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;border:none;background:none}
.hbg span{display:block;width:24px;height:2px;background:var(--gt);border-radius:2px;transition:var(--tr)}
.hbg.op span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hbg.op span:nth-child(2){opacity:0}
.hbg.op span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mm{display:none;position:fixed;top:72px;left:0;right:0;background:var(--w);border-bottom:1px solid var(--gb);padding:16px 24px 24px;z-index:999;box-shadow:var(--slg)}
.mm.op{display:block}
.mm ul{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.mm ul a{display:block;padding:12px 16px;font-weight:600;color:var(--gt);border-radius:10px;transition:var(--tr)}
.mm ul a:hover{background:var(--gl);color:var(--bd)}
.nav-ofertas-mob{color:var(--bd)!important;font-weight:700!important}
.main-prod{flex:1;padding:60px 0 100px;background:var(--gl)}
.p-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;background:var(--w);border-radius:var(--rxl);box-shadow:var(--slg);padding:40px;align-items:center}
.p-img-col{background:var(--gl);border-radius:var(--rlg);display:flex;align-items:center;justify-content:center;padding:40px;min-height:400px}
.p-img-col img{max-height:400px;object-fit:contain;mix-blend-mode:multiply}
.p-info-col{padding:20px 0}
.p-cat{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bd);margin-bottom:12px;display:inline-block;background:rgba(0,102,204,.1);padding:6px 14px;border-radius:50px}
.p-title{font-family:var(--fh);font-size:2.5rem;font-weight:900;color:var(--gt);line-height:1.2;margin-bottom:16px}
.p-sub{font-size:1.1rem;color:var(--bd);font-weight:600;margin-bottom:24px}
.p-desc{font-size:1.05rem;color:var(--gs);line-height:1.7;margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid var(--gb)}
.p-price-box{margin-bottom:32px}
.p-price-label{font-size:.9rem;color:var(--gmu);font-weight:600;margin-bottom:4px}
.p-price{font-family:var(--fh);font-size:3rem;font-weight:900;color:#e53e3e;line-height:1}
.p-actions{display:flex;gap:16px}
.btn-buy{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--gwa);color:var(--w);font-family:var(--fh);font-size:1.1rem;font-weight:800;padding:18px 36px;border-radius:100px;transition:var(--tr);box-shadow:0 8px 24px rgba(37,211,102,.3);flex:1;text-align:center}
.btn-buy:hover{background:var(--gwd);transform:translateY(-3px);box-shadow:0 12px 32px rgba(37,211,102,.4)}
.btn-buy svg{width:24px;height:24px}
.btn-back{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--w);color:var(--gs);font-weight:700;padding:18px 24px;border-radius:100px;border:2px solid var(--gb);transition:var(--tr)}
.btn-back:hover{background:var(--gl);color:var(--gt);border-color:var(--gmu)}
.loader{display:inline-block;width:60px;height:60px;border:5px solid var(--gm);border-top-color:var(--bd);border-radius:50%;animation:spin .8s linear infinite;margin:100px auto;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
footer{background:var(--bh);border-top:1px solid rgba(255,255,255,.08);padding:32px 0;color:rgba(255,255,255,.8);margin-top:auto}
.fbot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.fcopy{font-size:.8rem;color:rgba(255,255,255,.5)}
.fwab{display:inline-flex;align-items:center;gap:8px;background:var(--gwa);color:white;font-size:.85rem;font-weight:700;padding:10px 20px;border-radius:100px;transition:var(--tr)}
.fwab:hover{background:var(--gwd)}
@media(max-width:960px){
.p-wrap{grid-template-columns:1fr;gap:30px;padding:24px}
.p-img-col{min-height:300px;padding:24px}
.p-title{font-size:2rem}
.nlinks,.nwa{display:none}.hbg{display:flex}
}
@media(max-width:600px){
.p-actions{flex-direction:column}
.p-price{font-size:2.4rem}
}
</style></head>
